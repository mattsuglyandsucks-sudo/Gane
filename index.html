<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#05080d" />
<link rel="manifest" href="manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Shadow Grid" />
<title>ctOS: Shadow Grid</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#05080d;--panel:#0a111a;--panel2:#0d1723;--line:#1d3446;--cyan:#39f5ff;
  --green:#6bff9e;--yellow:#ffd65c;--red:#ff4b67;--text:#daf8ff;--muted:#79a0ad;
  --glass:rgba(7,14,22,.82);--safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.25 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;background:
radial-gradient(circle at 50% 10%,rgba(57,245,255,.06),transparent 34%),
linear-gradient(#05080d,#060b11)}
.topbar{height:58px;padding:9px 11px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);background:rgba(4,9,14,.96);z-index:30}
.logo{font-weight:900;letter-spacing:2.2px;color:var(--cyan);font-size:14px}.logo b{color:#fff}
.status{margin-left:auto;display:flex;gap:7px}
.chip{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#071019;color:#b9dce7;font-size:11px;white-space:nowrap}
.chip.hot{color:#fff;border-color:#7e2432;background:#35121a}
.main{position:relative;flex:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;overflow:hidden;background:#071018}
#leafletMap{position:absolute;inset:0;z-index:0;touch-action:none}
#leafletMap .leaflet-tile-pane{filter:invert(1) grayscale(1) sepia(1) saturate(5.5) hue-rotate(118deg) brightness(.34) contrast(2.05)}
#leafletMap .leaflet-control-attribution{font-size:8px;background:rgba(3,8,13,.72)!important;color:#7195a2!important}
#leafletMap .leaflet-control-attribution a{color:#68dfe9!important}
#leafletMap .leaflet-control-zoom{display:none}
.mapTint{display:none}
.mapNoise{display:none}
.grid{display:none;position:absolute;inset:-100px;background-image:
linear-gradient(rgba(57,245,255,.045) 1px,transparent 1px),
linear-gradient(90deg,rgba(57,245,255,.045) 1px,transparent 1px);
background-size:42px 42px;transform:rotate(.001deg)}
.road{display:none;position:absolute;background:#0d1b27;box-shadow:0 0 0 1px rgba(90,130,150,.08) inset}
.road.h{height:22px;width:140%;left:-20%}.road.v{width:22px;height:140%;top:-20%}
.poi{position:absolute;width:44px;height:44px;margin:-22px;border-radius:50%;border:1px solid #315163;background:#0b1620;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(0,0,0,.55);z-index:4;transition:.15s transform}
.poi:active{transform:scale(.9)}.poi.available{border-color:var(--cyan);box-shadow:0 0 18px rgba(57,245,255,.22)}
.poi.locked{opacity:.55}.poi.done{border-color:#376c50;color:var(--green)}.poi.hot{border-color:var(--red);box-shadow:0 0 16px rgba(255,75,103,.25)}
.poi .ico{font-size:19px}.poi .dist{position:absolute;top:47px;font-size:9px;background:#071019dd;padding:2px 4px;border-radius:3px;color:#9fc3cf;white-space:nowrap}
.player{display:none;position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;background:var(--cyan);border:3px solid #dfffff;box-shadow:0 0 0 7px rgba(57,245,255,.12),0 0 20px var(--cyan);z-index:10}
.player:after{content:"";position:absolute;width:4px;height:12px;left:5px;top:-11px;background:#dfffff;border-radius:3px;transform-origin:50% 18px}
.ring{display:none;position:absolute;left:50%;top:50%;width:160px;height:160px;margin:-80px;border:1px solid rgba(57,245,255,.09);border-radius:50%;z-index:1}
.coords{position:absolute;left:8px;top:8px;z-index:12;padding:6px 7px;background:#041018cc;border:1px solid var(--line);font-size:10px;color:#8fb6c2}
.mapBtns{position:absolute;right:9px;top:9px;display:flex;flex-direction:column;gap:7px;z-index:12}.zoomCtl{display:flex;flex-direction:column;gap:5px;margin-top:5px}.zoomCtl .iconBtn{height:36px}
.iconBtn{width:42px;height:42px;border:1px solid var(--line);border-radius:8px;background:#071019e6;color:var(--cyan);font-size:17px}
.bottom{height:78px;padding:7px 8px calc(7px + var(--safe));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;border-top:1px solid var(--line);background:#050b11;z-index:25}
.nav{border:1px solid transparent;background:transparent;color:#6f929e;border-radius:7px;font-size:10px}.nav .nicon{display:block;font-size:20px;margin-bottom:3px}.nav.active{color:var(--cyan);background:#09141e;border-color:#183245}
.sheet{position:absolute;inset:auto 0 0 0;height:min(78%,680px);max-height:78%;z-index:20;background:linear-gradient(#0b141e,#081019);border-top:1px solid #234153;border-radius:16px 16px 0 0;transform:translateY(105%);transition:.25s;overflow:hidden;box-shadow:0 -12px 40px #0008;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}
.handle{width:46px;height:4px;background:#33505f;border-radius:2px;margin:7px auto}
.sheetHead{padding:6px 15px 11px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #142a38}
.sheetHead h2{font-size:16px;margin:0}.sheetHead .close{margin-left:auto;background:none;border:0;color:#81aab7;font-size:22px}
.sheetBody{padding:12px 13px calc(24px + var(--safe));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.card{border:1px solid #173142;background:#09141e;border-radius:9px;padding:11px;margin-bottom:8px}.card h3{margin:0 0 5px;font-size:13px}.muted{color:var(--muted);font-size:11px}.cyan{color:var(--cyan)}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}
.bar{height:7px;background:#101f2a;border-radius:9px;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:var(--cyan);width:50%}
.btn{width:100%;border:1px solid #286074;background:#0c2731;color:#d9fbff;border-radius:7px;padding:11px 10px;font-weight:800;letter-spacing:.3px;margin-top:8px}.btn:active{transform:translateY(1px);background:#103543}.btn.red{border-color:#7c2e3a;background:#2b1117}.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}.row>*{flex:1}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stat{padding:9px;border:1px solid #173142;background:#09131c;border-radius:7px}.stat b{font-size:17px;display:block}
.mission{padding:10px;border-left:3px solid var(--cyan);background:#09141e;margin-bottom:8px}.mission.done{border-color:var(--green)}
.upgrade{display:flex;align-items:center;gap:10px}.upgrade .uinfo{flex:1}.upgrade button{width:auto;padding:7px 10px;margin:0}
.console{height:118px;overflow:hidden;border:1px solid #153042;border-radius:6px;background:#03080d;padding:7px;font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#80dbe2;margin-top:8px}
.toast{position:absolute;top:72px;left:50%;transform:translate(-50%,-20px);padding:8px 12px;border:1px solid #285164;border-radius:6px;background:#07131ce8;color:#dffcff;z-index:50;opacity:0;pointer-events:none;transition:.2s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scan{position:absolute;left:50%;top:50%;z-index:11;width:10px;height:10px;margin:-5px;border:1px solid var(--cyan);border-radius:50%;opacity:0;}.scan.go{animation:scan 1.1s ease-out}
@keyframes scan{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(45)}}
.pulse{animation:pulse 1.1s infinite}@keyframes pulse{50%{box-shadow:0 0 28px rgba(57,245,255,.5)}}
.hackline{height:12px;background:#071019;border:1px solid #173d4e;margin:4px 0;position:relative;overflow:hidden}.hackline i{height:100%;width:16%;background:var(--cyan);position:absolute;left:0;animation:slide 1.1s linear infinite}@keyframes slide{50%{left:84%}}
.small{font-size:10px}.divider{height:1px;background:#153042;margin:10px 0}
.device{display:flex;align-items:center;gap:10px;cursor:pointer}.device .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid #2b5868;background:#0b1c27;font-size:19px;flex:0 0 auto}.device .dmain{flex:1;min-width:0}.device .dmain b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-block;font-size:9px;padding:3px 5px;border:1px solid #23485a;border-radius:4px;margin:4px 4px 0 0;color:#9ed7e2}.poi.dim{opacity:.28}.poi.focused{transform:scale(1.12);z-index:8}
label.toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 0}input[type=checkbox]{width:20px;height:20px;accent-color:#2bd6e4}

#leafletMap{touch-action:none!important}
.mapTint,.mapNoise{display:none!important}
.playerPin{width:24px;height:24px;border-radius:50%;background:#39f5ff;border:4px solid #efffff;
box-shadow:0 0 0 8px rgba(57,245,255,.22),0 0 30px #39f5ff;position:relative}
.playerPin:after{content:"YOU";position:absolute;top:28px;left:50%;transform:translateX(-50%);
font-size:9px;font-weight:900;color:#eaffff;background:#061019;border:1px solid #39f5ff;border-radius:3px;padding:2px 4px;white-space:nowrap}
.ctosPoi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#07131d;border:2px solid #39f5ff;
box-shadow:0 0 0 4px rgba(57,245,255,.11),0 0 18px rgba(57,245,255,.5);font-size:20px;color:#eaffff;position:relative}
.ctosPoi.locked{border-color:#61737c;box-shadow:0 0 10px #0008;color:#8aa0aa;opacity:.72}
.ctosPoi.done{border-color:#6bff9e;color:#6bff9e}
.ctosPoi .poiDist{position:absolute;top:48px;left:50%;transform:translateX(-50%);font-size:9px;background:#051019e8;
border:1px solid #193847;border-radius:3px;padding:2px 4px;color:#c7e9ef;white-space:nowrap}

.leaflet-container{background:#010508!important}
#leafletMap:after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:400;
  background:
    radial-gradient(circle at 50% 50%,rgba(0,255,220,.035),transparent 42%),
    linear-gradient(rgba(0,0,0,.10),rgba(0,0,0,.28));
  mix-blend-mode:screen
}
.ctosPoi{background:#031015!important;border-color:#35f6df!important;color:#eaffff!important;
box-shadow:0 0 0 4px rgba(53,246,223,.10),0 0 18px rgba(53,246,223,.55)!important}
.playerPin{background:#35f6df!important;box-shadow:0 0 0 8px rgba(53,246,223,.22),0 0 30px #35f6df!important}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">ct<b>OS</b> // SHADOW GRID</div>
    <div class="status">
      <div class="chip" id="levelChip">LV 1</div>
      <div class="chip" id="cashChip">$0</div>
      <div class="chip" id="heatChip">HEAT 0</div>
    </div>
  </div>
  <div class="main">
    <div id="map">
      <div id="leafletMap"></div>
      <div class="mapTint"></div>
      <div class="mapNoise"></div>
      <div class="grid" id="grid"></div>
      <div class="road h" style="top:28%"></div><div class="road h" style="top:67%"></div>
      <div class="road v" style="left:24%"></div><div class="road v" style="left:72%"></div>
      <div class="ring"></div><div class="scan" id="scanFx"></div>
      <div class="player" id="player"></div>
      <div class="coords" id="coords">GPS: starting…</div>
      <div class="mapBtns">
  <button class="iconBtn" id="locateBtn" aria-label="Refresh GPS">◎</button>
  <button class="iconBtn" id="scanBtn" aria-label="Profiler scan">⌁</button>
  <div class="zoomCtl"><button class="iconBtn" id="zoomIn" aria-label="Zoom in">＋</button><button class="iconBtn" id="zoomOut" aria-label="Zoom out">−</button></div>
</div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="sheet" id="sheet"><div class="handle"></div><div class="sheetHead"><h2 id="sheetTitle">SYSTEM</h2><button class="close" id="closeSheet">×</button></div><div class="sheetBody" id="sheetBody"></div></div>
  </div>
  <div class="bottom">
    <button class="nav active" data-tab="map"><span class="nicon">⌖</span>GRID</button>
    <button class="nav" data-tab="missions"><span class="nicon">▣</span>OPS</button>
    <button class="nav" data-tab="skills"><span class="nicon">◇</span>SKILLS</button>
    <button class="nav" data-tab="profile"><span class="nicon">◉</span>PROFILE</button>
    <button class="nav" data-tab="settings"><span class="nicon">⚙</span>SETTINGS</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const TYPES={
 school:{icon:"▦",name:"School Network",min:18,max:180,diff:1,reward:[25,70]},
 church:{icon:"♢",name:"Community Church",min:18,max:170,diff:1,reward:[18,55]},
 library:{icon:"▤",name:"Public Library",min:20,max:190,diff:1,reward:[25,65]},
 hospital:{icon:"✚",name:"Medical Center",min:25,max:220,diff:3,reward:[55,130]},
 police:{icon:"⬟",name:"Police Grid",min:30,max:240,diff:5,reward:[100,240]},
 transit:{icon:"⇄",name:"Transit Control",min:20,max:200,diff:2,reward:[35,95]},
 utility:{icon:"⚡",name:"Utility Substation",min:22,max:210,diff:3,reward:[50,120]},
 camera:{icon:"◈",name:"Street Camera",min:10,max:120,diff:1,reward:[8,28]},
 tower:{icon:"⌁",name:"Signal Relay",min:20,max:200,diff:2,reward:[40,110]},
 bank:{icon:"▰",name:"Financial Node",min:25,max:230,diff:4,reward:[90,210]},
 parking:{icon:"P",name:"Parking System",min:12,max:140,diff:1,reward:[12,40]},
 civic:{icon:"▥",name:"Civic Facility",min:20,max:190,diff:2,reward:[35,90]}
};
const initial={cash:0,xp:0,level:1,heat:0,hacks:0,rep:0,skill:0,lat:null,lon:null,accuracy:null,mapZoom:1.45,
 upgrades:{range:0,speed:0,stealth:0,payout:0,scanner:0},completed:{},missions:[],lastDay:"",poisMode:"auto",trackedDevice:null};
let S=Object.assign({},initial,JSON.parse(localStorage.getItem("shadowgrid")||"{}"));
S.upgrades=Object.assign({},initial.upgrades,S.upgrades||{});
let pois=[],watchId=null,selected=null,simTick=0,devices=[],realMap=null,playerMarker=null,poiMarkers=[];
const save=()=>localStorage.setItem("shadowgrid",JSON.stringify(S));
function toast(t){let e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1800)}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function prng(seed){
 return ()=>{
   seed |= 0;
   seed = Math.imul(seed ^ (seed >>> 15), 1 | seed);
   seed ^= seed + Math.imul(seed ^ (seed >>> 7), 61 | seed);
   return ((seed ^ (seed >>> 14)) >>> 0) / 4294967296;
 };
}
function levelReq(l){return 100+Math.floor(l*l*42)}
function updateHUD(){
 $("#cashChip").textContent="$"+S.cash.toLocaleString();$("#levelChip").textContent="LV "+S.level;
 $("#heatChip").textContent="HEAT "+Math.round(S.heat);$("#heatChip").classList.toggle("hot",S.heat>=50);
}
function gainXp(n){S.xp+=n;while(S.xp>=levelReq(S.level)){S.xp-=levelReq(S.level);S.level++;S.skill++;toast("LEVEL UP // skill point acquired")}save();updateHUD()}
function distanceM(lat1,lon1,lat2,lon2){const R=6371e3,p1=lat1*Math.PI/180,p2=lat2*Math.PI/180,dp=(lat2-lat1)*Math.PI/180,dl=(lon2-lon1)*Math.PI/180;const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function metersToDelta(m,angle){return {lat:(m*Math.cos(angle))/111320,lon:(m*Math.sin(angle))/(111320*Math.cos((S.lat||45)*Math.PI/180))}}

function initRealMap(){
 if(realMap || typeof L==="undefined") return;
 realMap=L.map("leafletMap",{
   zoomControl:false,
   attributionControl:true,
   preferCanvas:true,
   touchZoom:true,
   dragging:true,
   doubleClickZoom:true,
   scrollWheelZoom:true,
   tap:true,
   zoomSnap:0.5,
   zoomDelta:0.5
 }).setView([S.lat||42.3265,S.lon||-122.8756],17);

 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
   maxZoom:19,
   minZoom:3,
   attribution:'&copy; OpenStreetMap contributors',
   crossOrigin:true,
   updateWhenIdle:false,
   keepBuffer:4
 }).addTo(realMap);

 const icon=L.divIcon({
   className:"",
   html:'<div class="playerPin"></div>',
   iconSize:[24,24],
   iconAnchor:[12,12]
 });
 playerMarker=L.marker([S.lat||42.3265,S.lon||-122.8756],{
   icon,
   interactive:false,
   zIndexOffset:10000
 }).addTo(realMap);

 const fixSize=()=>{
   if(!realMap)return;
   realMap.invalidateSize({pan:false,animate:false});
 };
 requestAnimationFrame(()=>requestAnimationFrame(fixSize));
 setTimeout(fixSize,250);
 setTimeout(fixSize,900);

 realMap.on("zoomend moveend",()=>{syncZoomFromMap();renderPOIs()});
}
function syncZoomFromMap(){
 if(!realMap)return;
 const z=realMap.getZoom();
 S.mapZoom=Math.max(.75,Math.min(3,.75+(z-14)*.38));
}
function syncMapPosition(){
 if(!realMap)return;
 playerMarker?.setLatLng([S.lat,S.lon]);
 const center=realMap.getCenter();
 const drift=distanceM(S.lat,S.lon,center.lat,center.lng);
 if(drift>180) realMap.panTo([S.lat,S.lon],{animate:true,duration:.5});
}
function seedPOIs(){
 if(S.lat==null){S.lat=42.3265;S.lon=-122.8756}
 const key=S.lat.toFixed(3)+","+S.lon.toFixed(3), r=prng(hash(key)), names=Object.keys(TYPES);
 pois=[];
 for(let i=0;i<42;i++){
   const ang=r()*Math.PI*2, d=28+r()*520, dd=metersToDelta(d,ang), type=names[Math.floor(r()*names.length)];
   pois.push({id:"p"+hash(key+i),lat:S.lat+dd.lat,lon:S.lon+dd.lon,type,name:TYPES[type].name+" "+String.fromCharCode(65+(i%26)),real:false});
 }
 renderPOIs();ensureMissions();
}
async function fetchRealPOIs(){
 if(S.lat==null)return;
 const q=`[out:json][timeout:8];(nwr(around:1300,${S.lat},${S.lon})["amenity"~"school|place_of_worship|library|hospital|police|bank|parking"];nwr(around:1300,${S.lat},${S.lon})["power"="substation"];nwr(around:1300,${S.lat},${S.lon})["public_transport"];);out center 60;`;
 try{
  const res=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:q,headers:{"Content-Type":"text/plain"}});
  if(!res.ok)throw 0;
  const data=await res.json(), real=[];
  for(const e of data.elements||[]){
   const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon;
   if(lat==null||lon==null)continue;
   const a=e.tags?.amenity,p=e.tags?.power,pt=e.tags?.public_transport;
   const type=a==="school"?"school":
     a==="place_of_worship"?"church":
     a==="library"?"library":
     a==="hospital"?"hospital":
     a==="police"?"police":
     a==="bank"?"bank":
     a==="parking"?"parking":
     p==="substation"?"utility":
     pt?"transit":"civic";
   real.push({id:"osm"+e.type+e.id,lat,lon,type,name:e.tags?.name||TYPES[type].name,real:true});
  }

  // Keep procedural nodes and merge real places into them instead of replacing everything.
  const merged=new Map();
  for(const p of pois) merged.set(p.id,p);
  for(const p of real) merged.set(p.id,p);

  // De-dupe locations that are nearly on top of each other.
  const combined=[...merged.values()].sort((a,b)=>(b.real?1:0)-(a.real?1:0));
  const deduped=[];
  for(const p of combined){
    const duplicate=deduped.some(x=>distanceM(p.lat,p.lon,x.lat,x.lon)<16 && p.type===x.type);
    if(!duplicate) deduped.push(p);
  }

  // Always retain enough nearby targets so the grid never appears to "vanish".
  pois=deduped.slice(0,70);
  if(pois.length<12) seedPOIs();
  renderPOIs();

  if(real.length) toast(`${real.length} public locations indexed // grid merged`);
  else toast("No public locations found nearby // local grid retained");
 }catch(e){
  if(!pois.length) seedPOIs();
  renderPOIs();
  toast("Public map data unavailable // local grid retained");
 }
}
function renderPOIs(){
 if(S.lat==null)return;
 initRealMap();
 if(!realMap)return;
 realMap.invalidateSize({pan:false});

 const previous=poiMarkers;
 poiMarkers=[];

 const range=95+S.upgrades.range*35;
 const bounds=realMap.getBounds().pad(.35);
 const visible=pois.map(p=>({p,d:Math.round(distanceM(S.lat,S.lon,p.lat,p.lon))}))
   .filter(o=>bounds.contains([o.p.lat,o.p.lon]))
   .sort((a,b)=>a.d-b.d)
   .slice(0,28);

 for(const o of visible){
   const {p,d}=o,t=TYPES[p.type],available=d<=range,done=!!S.completed[p.id];
   const cls=done?"done":available?"available":"locked";
   const icon=L.divIcon({
     className:"",
     html:`<div class="ctosPoi ${cls}"><span>${t.icon}</span><span class="poiDist">${d}m</span></div>`,
     iconSize:[46,46],
     iconAnchor:[23,23]
   });
   const marker=L.marker([p.lat,p.lon],{icon,zIndexOffset:1000}).addTo(realMap);
   marker.on("click",()=>openPOI(p,d));
   poiMarkers.push(marker);
 }

 // Remove old markers only after the new marker set is on the map.
 previous.forEach(m=>realMap.removeLayer(m));
 syncMapPosition();
}
function openPOI(p,d){
 selected=p;const t=TYPES[p.type],range=95+S.upgrades.range*35,done=S.completed[p.id];
 openSheet(t.icon+" "+p.name,`
 <div class="card"><div class="muted">${p.real?"PUBLIC LOCATION // OSM":"PROCEDURAL GRID NODE"}</div>
 <h3>${t.name}</h3><div class="muted">Range ${d}m / ${range}m · Security ${t.diff}/5</div>
 <div class="divider"></div><div>${flavor(p.type)}</div>
 <button class="btn" id="hackBtn" ${d>range?"disabled":""}>${done?"RE-ENTER SYSTEM":"INITIATE BREACH"}</button></div>
 <div class="card"><b>Available vectors</b><div class="muted" style="margin-top:5px">${vectors(p.type).join(" · ")}</div></div>`);
 $("#hackBtn")?.addEventListener("click",()=>runHack(p,d));
}
function flavor(t){return {
 school:"Campus access node detected. PA controls, doors, camera loops and digital signage are exposed through the local grid.",
 church:"Community facility node detected. Lighting, bells, AV systems and local cameras are visible on the grid.",
 library:"Public information node. Terminals, lighting, printers and camera feeds are available.",
 hospital:"High-security infrastructure with limited access windows.",
 police:"Restricted ctOS node. High payout, very high detection risk.",
 transit:"Transit routing controls and signage available in the simulation.",
 utility:"Power-routing node with switching and alarm controls.",
 camera:"Low-security camera node useful for reconnaissance and chaining.",
 tower:"Signal relay that can reveal additional nearby targets.",
 bank:"High-security financial node with valuable data routes.",
 parking:"Parking gate, ticketing and camera simulation.",
 civic:"Municipal facility with mixed fictional control systems."
 }[t]||"ctOS-connected infrastructure."}
function vectors(t){return {
 school:["CAMERAS","SIGNAGE","PA","LOCKS"],church:["LIGHTS","AV","BELLS","CAMERAS"],library:["TERMINALS","LIGHTS","CAMERAS","PRINTERS"],
 hospital:["CAMERAS","ELEVATORS","SIGNAGE"],police:["CAMERAS","GATES","DISPATCH DECOY"],transit:["SIGNALS","BOARDS","CAMERAS"],
 utility:["GRID ROUTE","LOAD BALANCE","ALARM LOOP"],camera:["FEED LOOP","TAG","CHAIN"],tower:["SCAN BOOST","SIGNAL PIVOT","REVEAL"],
 bank:["CAMERAS","VAULT DECOY","ALARM LOOP"],parking:["GATE","METERS","CAMERAS"],civic:["LIGHTS","CAMERAS","ACCESS"]
 }[t]||["ACCESS","SCAN"]}
function runHack(p,d){
 const t=TYPES[p.type], body=$("#sheetBody");let prog=0, duration=Math.max(850,2400-S.upgrades.speed*260+t.diff*160);
 body.innerHTML=`<div class="card pulse"><h3>BREACH IN PROGRESS</h3><div class="muted">ctOS intrusion sequence</div><div class="hackline"><i></i></div><div class="console" id="console"></div></div>`;
 const lines=["route.shadow_link()","spoof.ctos_token()","scan.virtual_ports()","inject.simulated_payload()","mask.trace_signature()","pivot.local_node()","decrypt.game_layer()"];
 const c=$("#console"),iv=setInterval(()=>{prog+=120;c.innerHTML+=`> ${lines[rnd(0,lines.length-1)]}<br>`;c.scrollTop=c.scrollHeight;if(prog>=duration){clearInterval(iv);resolveHack(p)}},120)
}
function resolveHack(p){
 const t=TYPES[p.type], stealth=S.upgrades.stealth*5, chance=Math.max(7,t.diff*13-stealth),detected=Math.random()*100<chance;
 const base=rnd(t.reward[0],t.reward[1]),cash=Math.round(base*(1+S.upgrades.payout*.14)),xp=18+t.diff*11;
 S.cash+=cash;S.hacks++;S.rep+=t.diff*2;gainXp(xp);if(detected){S.heat=Math.min(100,S.heat+rnd(10,22)+t.diff*3)}
 S.completed[p.id]=Date.now();progressMissions(p.type);save();updateHUD();renderPOIs();
 $("#sheetBody").innerHTML=`<div class="card"><h3 class="${detected?"red":"green"}">${detected?"TRACE DETECTED":"ACCESS COMPLETE"}</h3>
 <div class="statgrid"><div class="stat"><span class="muted">CREDITS</span><b>+$${cash}</b></div><div class="stat"><span class="muted">XP</span><b>+${xp}</b></div></div>
 <div class="muted" style="margin-top:9px">${detected?"ctOS heat increased. Keep moving or use a cooldown operation.":"Signature masked successfully."}</div>
 <button class="btn" id="again">RETURN TO GRID</button></div>`;$("#again").onclick=closeSheet;
}

function makeDevices(){
 const first=["Avery","Maya","Jordan","Eli","Noah","Riley","Morgan","Taylor","Cameron","Quinn","Alex","Sam","Jamie","Drew","Casey","Robin"];
 const last=["Reed","Torres","Chen","Miller","Diaz","Patel","Brooks","Nguyen","Walker","Price","Kim","Martinez","Gray","Bennett"];
 const jobs=["Teacher","Nurse","Contractor","Student","Barista","Mechanic","Accountant","Designer","Delivery Driver","Engineer","Cook","Retail Worker","Photographer","Office Manager","Electrician","Musician"];
 const traits=["Frequent traveler","Online shopper","Night owl","Sports fan","Heavy texter","Pet owner","Gamer","Coffee regular","Fitness tracker","Music subscriber","Local volunteer","Commutes daily"];
 const r=prng(hash((S.lat||0).toFixed(4)+","+(S.lon||0).toFixed(4)+Math.floor(Date.now()/120000)));
 devices=[];
 const count=8+S.upgrades.scanner*2;
 for(let i=0;i<count;i++){
   const name=first[Math.floor(r()*first.length)]+" "+last[Math.floor(r()*last.length)];
   const dist=Math.round(8+r()*(70+S.upgrades.scanner*18));
   const worth=Math.round(10+r()*90)*(1+S.upgrades.scanner);
   devices.push({
     id:"d"+hash(name+i+Math.floor(Date.now()/120000)),
     name,dist,job:jobs[Math.floor(r()*jobs.length)],
     trait:traits[Math.floor(r()*traits.length)],
     worth,security:1+Math.floor(r()*5),battery:25+Math.floor(r()*75),
     used:false,tracked:S.trackedDevice===name
   });
 }
}
function profilerScan(){
 let fx=$("#scanFx");fx.classList.remove("go");void fx.offsetWidth;fx.classList.add("go");
 makeDevices();
 const rows=devices.sort((a,b)=>a.dist-b.dist).map(d=>`
 <div class="card device" data-device="${d.id}">
   <div class="avatar">◉</div>
   <div class="dmain"><b>${d.name}</b><div class="muted">${d.job} · ${d.dist}m · Phone ${d.battery}%</div>
   <span class="tag">SEC ${d.security}</span><span class="tag">${d.trait}</span>${d.tracked?'<span class="tag green">TRACKED</span>':''}</div>
   <div class="cyan">›</div>
 </div>`).join("");
 openSheet("PROFILER // NEARBY",`<div class="muted" style="margin-bottom:8px">Nearby personal devices detected: ${devices.length}</div>${rows}`);
 $$(".device[data-device]").forEach(e=>e.onclick=()=>openDevice(devices.find(d=>d.id===e.dataset.device)));
}
function openDevice(d){
 if(!d)return;
 const actions=d.used?`<div class="muted">This device has already been accessed during the current scan.</div>`:`
 <div class="row"><button class="btn deviceAction" data-a="data">DATA PULL</button><button class="btn deviceAction" data-a="cash">CASH ROUTE</button></div>
 <div class="row"><button class="btn deviceAction" data-a="distraction">DISTRACT</button><button class="btn deviceAction" data-a="track">TRACK</button></div>`;
 openSheet("PHONE // "+d.name,`
 <div class="card"><h3>${d.name}</h3><div class="muted">${d.job} · ${d.dist}m away</div>
 <div class="divider"></div>
 <div class="statgrid"><div class="stat"><span class="muted">SECURITY</span><b>${d.security}/5</b></div><div class="stat"><span class="muted">BATTERY</span><b>${d.battery}%</b></div></div>
 <div style="margin-top:9px"><span class="tag">${d.trait}</span><span class="tag">VALUE ~$${d.worth}</span></div></div>
 <div class="card"><b>PHONE ACCESS</b>${actions}</div>
 <button class="btn" id="backScan">← BACK TO SCAN</button>`);
 $("#backScan").onclick=profilerScan;
 $$(".deviceAction").forEach(b=>b.onclick=()=>deviceAction(d,b.dataset.a));
}
function deviceAction(d,a){
 if(d.used && a!=="track")return;
 let msg="",xp=0;
 if(a==="data"){
   xp=10+d.security*4;S.rep+=1+d.security;msg=`Data package acquired // +${xp} XP`;
   gainXp(xp);d.used=true;
 } else if(a==="cash"){
   const gain=Math.max(8,Math.round(d.worth*(.45+S.upgrades.payout*.08)));
   S.cash+=gain;S.heat=Math.min(100,S.heat+d.security*2);msg=`Account token routed // +$${gain}`;d.used=true;
 } else if(a==="distraction"){
   const drop=4+S.upgrades.stealth*2;S.heat=Math.max(0,S.heat-drop);msg=`Device distraction triggered // heat -${drop}`;d.used=true;
 } else if(a==="track"){
   S.trackedDevice=d.name;devices.forEach(x=>x.tracked=x.id===d.id);msg=`${d.name} marked in Profiler`;
 }
 save();updateHUD();toast(msg);openDevice(d);
}
function ensureMissions(){
 const day=new Date().toISOString().slice(0,10);if(S.lastDay!==day||!S.missions?.length){
  const typeKeys=Object.keys(TYPES), r=prng(hash(day+(S.lat||0).toFixed(2)));
  S.missions=[
   {id:day+"a",title:"Neighborhood Sweep",type:typeKeys[Math.floor(r()*typeKeys.length)],goal:3,progress:0,reward:180},
   {id:day+"b",title:"Ghost Route",type:"any",goal:7,progress:0,reward:420},
   {id:day+"c",title:"High Value Target",type:["hospital","police","bank","utility"][Math.floor(r()*4)],goal:1,progress:0,reward:310}
  ];S.lastDay=day;save();
 }
}
function progressMissions(type){for(const m of S.missions){if(!m.claimed&&m.progress<m.goal&&(m.type==="any"||m.type===type))m.progress++}save()}
function missionsView(){
 ensureMissions();let h=`<div class="muted" style="margin-bottom:8px">DAILY OPERATIONS // refresh automatically each day</div>`;
 for(const m of S.missions){const done=m.progress>=m.goal;h+=`<div class="mission ${done?"done":""}"><b>${m.title}</b><div class="muted">${m.type==="any"?"Hack any nodes":"Target: "+TYPES[m.type].name}</div><div>${m.progress}/${m.goal} · $${m.reward}</div>${done&&!m.claimed?`<button class="btn claim" data-id="${m.id}">CLAIM</button>`:m.claimed?`<div class="green small">REWARD CLAIMED</div>`:""}</div>`}openSheet("OPERATIONS",h);$$(".claim").forEach(b=>b.onclick=()=>{let m=S.missions.find(x=>x.id===b.dataset.id);if(m&&!m.claimed){m.claimed=true;S.cash+=m.reward;gainXp(40);save();updateHUD();missionsView()}})
}
const ups={
 range:["REMOTE ACCESS","Increase interaction radius by 35m."],
 speed:["OVERCLK","Reduce breach sequence time."],
 stealth:["GHOST PROTOCOL","Reduce trace chance."],
 payout:["DATA BROKER","Increase credits from every node."],
 scanner:["DEEP SCAN","Detect more nearby phones and extend profiler range."]
};
function skillsView(){
 let h=`<div class="card"><b>Skill points: <span class="cyan">${S.skill}</span></b><div class="muted">Level up to earn more.</div></div>`;
 for(const [k,v] of Object.entries(ups)){let lv=S.upgrades[k];h+=`<div class="card upgrade"><div class="uinfo"><b>${v[0]} <span class="cyan">LV ${lv}/5</span></b><div class="muted">${v[1]}</div></div><button class="btn up" data-k="${k}" ${S.skill<1||lv>=5?"disabled":""}>UP</button></div>`}
 openSheet("SKILL TREE",h);$$(".up").forEach(b=>b.onclick=()=>{let k=b.dataset.k;if(S.skill&&S.upgrades[k]<5){S.skill--;S.upgrades[k]++;save();renderPOIs();skillsView()}})
}
function profileView(){
 const req=levelReq(S.level), pct=S.xp/req*100;
 openSheet("PROFILE",`<div class="card"><h3>SHADOW OPERATIVE</h3><div class="bar"><i style="width:${pct}%"></i></div><div class="muted">${S.xp}/${req} XP to next level</div></div>
 <div class="statgrid"><div class="stat"><span class="muted">TOTAL HACKS</span><b>${S.hacks}</b></div><div class="stat"><span class="muted">REPUTATION</span><b>${S.rep}</b></div><div class="stat"><span class="muted">CREDITS</span><b>$${S.cash}</b></div><div class="stat"><span class="muted">HEAT</span><b>${Math.round(S.heat)}</b></div></div>
 <div class="card" style="margin-top:8px"><b>Passive heat decay</b><div class="muted">Heat fades over time while the game is open. High heat increases the pressure of future encounters.</div><button class="btn" id="cool">BURN $150 // DROP 25 HEAT</button></div>`);
 $("#cool").onclick=()=>{if(S.cash>=150&&S.heat>0){S.cash-=150;S.heat=Math.max(0,S.heat-25);save();updateHUD();profileView()}else toast("Not enough credits or no heat to clear")}
}
function settingsView(){
 openSheet("SETTINGS",`<div class="card"><label class="toggle"><span><b>Use public OSM places</b><div class="muted">Schools, churches, libraries, civic facilities, etc.</div></span><input id="osm" type="checkbox" ${S.poisMode!=="procedural"?"checked":""}></label></div>
 <div class="card"><b>Privacy</b><div class="muted" style="margin-top:6px">GPS stays in this browser except when public-place lookup is enabled, which sends approximate coordinates to the OpenStreetMap Overpass service. Nearby phone profiles are generated locally by the game.</div></div>
 <div class="card"><button class="btn" id="gps">REFRESH GPS</button><button class="btn red" id="wipe">RESET ALL GAME DATA</button></div>`);
 $("#osm").onchange=e=>{S.poisMode=e.target.checked?"auto":"procedural";save();seedPOIs();if(e.target.checked)fetchRealPOIs()};
 $("#gps").onclick=startGPS;$("#wipe").onclick=()=>{if(confirm("Delete all Shadow Grid progress on this device?")){localStorage.removeItem("shadowgrid");location.reload()}}
}
function openSheet(title,html){$("#sheetTitle").textContent=title;$("#sheetBody").innerHTML=html;$("#sheet").classList.add("open")}
function closeSheet(){$("#sheet").classList.remove("open");$$(".nav").forEach(n=>n.classList.toggle("active",n.dataset.tab==="map"))}
$("#closeSheet").onclick=closeSheet;
$$(".nav").forEach(n=>n.onclick=()=>{let t=n.dataset.tab;$$(".nav").forEach(x=>x.classList.toggle("active",x===n));if(t==="map")closeSheet();if(t==="missions")missionsView();if(t==="skills")skillsView();if(t==="profile")profileView();if(t==="settings")settingsView()});
function startGPS(){
 const coord=$("#coords");
 if(!("geolocation" in navigator)){
   coord.textContent="GPS unsupported // simulation";
   toast("This browser does not provide geolocation");
   if(!pois.length) seedPOIs();
   return;
 }
 coord.textContent="GPS: requesting permission…";
 toast("Requesting location permission…");

 if(watchId) navigator.geolocation.clearWatch(watchId);

 let gotFix=false;
 const acceptPosition=(pos,label)=>{
   gotFix=true;
   const oldLat=S.lat, oldLon=S.lon;
   S.lat=pos.coords.latitude; S.lon=pos.coords.longitude; S.accuracy=pos.coords.accuracy;
   coord.textContent=`${label} ${S.lat.toFixed(5)}, ${S.lon.toFixed(5)} ±${Math.round(S.accuracy)}m`;
   save();
   initRealMap();syncMapPosition();
   if(!pois.length||oldLat==null||distanceM(oldLat,oldLon,S.lat,S.lon)>90){
     seedPOIs();
     if(S.poisMode!=="procedural") fetchRealPOIs();
   } else renderPOIs();
 };

 const fail=(err)=>{
   const msg = err.code===1 ? "Location permission denied"
             : err.code===2 ? "Location unavailable"
             : err.code===3 ? "GPS timed out"
             : "GPS error";
   coord.textContent=msg+" // tap ◎ to retry";
   toast(msg+". Check site permissions and Android Location.");
   if(!pois.length) seedPOIs();
 };

 // First request a fast approximate fix. This often uses Wi‑Fi/cell positioning.
 navigator.geolocation.getCurrentPosition(
   p=>acceptPosition(p,"GPS"),
   fail,
   {enableHighAccuracy:false, maximumAge:60000, timeout:10000}
 );

 // Then keep watching for more accurate fixes.
 watchId=navigator.geolocation.watchPosition(
   p=>acceptPosition(p,p.coords.accuracy<=50?"GPS precise":"GPS approx"),
   err=>{ if(!gotFix) fail(err); },
   {enableHighAccuracy:true, maximumAge:10000, timeout:20000}
 );
}
$("#locateBtn").onclick=()=>{startGPS();initRealMap();if(realMap&&S.lat!=null){realMap.invalidateSize();realMap.setView([S.lat,S.lon],Math.max(realMap.getZoom(),16),{animate:true})}renderPOIs();toast("Recentered on GPS")};
$("#scanBtn").onclick=profilerScan;
$("#zoomIn").onclick=()=>{initRealMap();realMap?.zoomIn();toast("Map zoom +")};
$("#zoomOut").onclick=()=>{initRealMap();realMap?.zoomOut();toast("Map zoom −")};
setInterval(()=>{simTick++;if(S.heat>0){S.heat=Math.max(0,S.heat-.35);if(simTick%5===0){save();updateHUD()}}},1000);
window.addEventListener("resize",()=>{realMap?.invalidateSize();renderPOIs()});updateHUD();ensureMissions();startGPS();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js?v=7").catch(()=>{}));
}
})();
</script>
